name: release-win-amd64

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-win-amd64
  cancel-in-progress: false

env:
  QT: "5.15.19"
  Platform: x64
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"

jobs:
  prepare-libs:
    name: prepare libraries (Qt 5.15.19 static)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'release' && !contains(github.event.release.body || '', '<!-- auto-built -->'))
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore ThirdParty cache
        id: cache-thirdparty
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/ThirdParty
          # WHY: an existing cache entry can never be overwritten, so the save
          # key carries run_id; a resumed partial cache must land under a new
          # key or its newly built stages are lost with the ephemeral runner.
          # WHY: the key hashes only qt_version.py because prepare.py's
          # per-stage cache_keys already invalidate individual stages; hashing
          # the script here would rebuild everything on every edit.
          key: thirdparty-win64-full-${{ github.run_id }}-${{ hashFiles('Telegram/build/qt_version.py') }}
          restore-keys: |
            thirdparty-win64-full-${{ hashFiles('Telegram/build/qt_version.py') }}

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/Libraries/win64
          key: libs-win64-full-${{ github.run_id }}-${{ hashFiles('Telegram/build/qt_version.py') }}
          restore-keys: |
            libs-win64-full-${{ hashFiles('Telegram/build/qt_version.py') }}

      - name: Prepare libraries
        id: prepare
        shell: pwsh
        env:
          Platform: x64
        run: |
          Set-Location Telegram/build/prepare
          # silent: reruns auto-rebuild stale stages; the getch prompt cannot run on CI
          cmd /c "win.bat silent" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/prepare.log"
          $code = $LASTEXITCODE
          Copy-Item "$env:RUNNER_TEMP/prepare.log" "$env:GITHUB_WORKSPACE/prepare.log" -ErrorAction SilentlyContinue
          exit $code

      - name: Detect rebuilt stage classes
        if: always()
        id: rebuilt
        shell: pwsh
        # prepare.py drops these markers when it actually rebuilt stages.
        # WHY: Out-File emits CRLF and the runner keeps the CR, so every
        # `== 'true'` gate silently failed; GITHUB_OUTPUT needs LF-only lines.
        run: |
          $libs = (Test-Path "${{ runner.workspace }}/Libraries/win64/cache_keys/_rebuilt_libs").ToString().ToLower()
          $thirdparty = (Test-Path "${{ runner.workspace }}/ThirdParty/cache_keys/_rebuilt_thirdparty").ToString().ToLower()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "libs=$libs`nthirdparty=$thirdparty`n")

      - name: Save ThirdParty cache
        id: save-thirdparty
        if: always() && steps.rebuilt.outputs.thirdparty == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.workspace }}/ThirdParty
          key: ${{ steps.cache-thirdparty.outputs.cache-primary-key }}

      - name: Save Libraries cache
        id: save-libs
        if: always() && steps.rebuilt.outputs.libs == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.workspace }}/Libraries/win64
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Report cache state
        if: always()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          "### 缓存状态" | Out-File -Append -Encoding UTF8 $summary
          "- thirdparty rebuild: ``${{ steps.rebuilt.outputs.thirdparty }}``" | Out-File -Append -Encoding UTF8 $summary
          "- libraries rebuild: ``${{ steps.rebuilt.outputs.libs }}``" | Out-File -Append -Encoding UTF8 $summary
          "- thirdparty cache hit: ``${{ steps.cache-thirdparty.outputs.cache-hit }}``（空 = 未命中）" | Out-File -Append -Encoding UTF8 $summary
          "- libraries cache hit: ``${{ steps.cache-libs.outputs.cache-hit }}``（空 = 未命中）" | Out-File -Append -Encoding UTF8 $summary
          "- thirdparty save: ``${{ steps.save-thirdparty.conclusion }}``" | Out-File -Append -Encoding UTF8 $summary
          "- libraries save: ``${{ steps.save-libs.conclusion }}``" | Out-File -Append -Encoding UTF8 $summary
          $libs = "${{ runner.workspace }}/Libraries/win64"
          if (Test-Path $libs) {
            $qt = @(Get-ChildItem "$libs/Qt-*" -Directory -ErrorAction SilentlyContinue).Count
            "- Libraries/win64 存在，Qt 目录数：$qt" | Out-File -Append -Encoding UTF8 $summary
          } else {
            "- Libraries/win64 不存在" | Out-File -Append -Encoding UTF8 $summary
          }

      - name: Summarize prepare result
        if: always()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          if ('${{ steps.prepare.outcome }}' -eq 'success') {
            "### prepare 成功" | Out-File -Append -Encoding UTF8 $summary
            "所有库准备步骤通过，完整日志见 ``prepare-log`` 附件。" |
              Out-File -Append -Encoding UTF8 $summary
            exit 0
          }

          $log = "$env:GITHUB_WORKSPACE/prepare.log"
          "### prepare 失败" | Out-File -Append -Encoding UTF8 $summary
          if (Test-Path $log) {
            $skip = @(
              '-- Performing Test',
              '-- Check size of',
              'Applying patch',
              'NOT FOUND, BUILDING',
              'echo ERROR'
            )
            # WHY: a case-insensitive 'error' matched msys package names and msbuild's "0 Error(s)" noise
            $hits = @(Select-String -Path $log -Pattern '\[ERROR\]|: FAILED|is not recognized|FullyQualifiedErrorId|fatal error|CMake Error|error C[0-9]+|error MSB[0-9]+|error LNK|LNK[0-9]{4}|Build FAILED' -CaseSensitive |
              Where-Object {
                $line = $_.Line
                -not ($skip | Where-Object { $line.Contains($_) })
              } |
              Select-Object -Last 40 |
              ForEach-Object { "- ``$($_.Line.Trim())``" })
            if ($hits.Count -gt 0) {
              $hits | Out-File -Append -Encoding UTF8 $summary
            } else {
              "未匹配到具体错误，见下方日志尾部。" |
                Out-File -Append -Encoding UTF8 $summary
            }
            '```' | Out-File -Append -Encoding UTF8 $summary
            Get-Content $log -Tail 120 | Out-File -Append -Encoding UTF8 $summary
            '```' | Out-File -Append -Encoding UTF8 $summary
          }

      - name: Upload prepare log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-log
          path: prepare.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build + package + publish
    needs: prepare-libs
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'release' && !contains(github.event.release.body || '', '<!-- auto-built -->'))
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore ThirdParty cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/ThirdParty
          # WHY: the save key carries run_id, so the exact lookup needs it
          # too; the hash-only restore-keys prefix matches the entry saved
          # by prepare-libs of the same or an earlier run.
          key: thirdparty-win64-full-${{ github.run_id }}-${{ hashFiles('Telegram/build/qt_version.py') }}
          restore-keys: |
            thirdparty-win64-full-${{ hashFiles('Telegram/build/qt_version.py') }}

      - name: Restore Libraries cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/Libraries/win64
          key: libs-win64-full-${{ github.run_id }}-${{ hashFiles('Telegram/build/qt_version.py') }}
          restore-keys: |
            libs-win64-full-${{ hashFiles('Telegram/build/qt_version.py') }}

      - name: Verify libraries
        shell: pwsh
        run: |
          if (!(Test-Path "${{ runner.workspace }}/Libraries/win64")) {
            "### prepare 没有产出 Libraries/win64" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            Get-ChildItem "${{ runner.workspace }}" -Force |
              Select-Object Name, Length |
              Out-String |
              Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            throw "Libraries 缓存缺失：prepare-libs job 失败。摘要见本页 Summary，完整日志见 prepare-log artifact。"
          }
          if (!(Get-ChildItem "${{ runner.workspace }}/Libraries/win64/Qt-*" -Directory -ErrorAction SilentlyContinue)) {
            "### Libraries 缓存缺 Qt" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            "缓存是旧的部分缓存（prepare 续跑补全的结果没有入缓存），configure 必然失败；用新 workflow 重跑 prepare-libs 保存完整缓存后重试。" |
              Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            throw "Libraries 缓存缺 Qt-*，configure 必然失败。"
          }

      - name: Compute version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}"
          $ver = $tag -replace '^v', ''
          "VERSION_TAG=$tag" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
          "VERSION=$ver" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
          if ($ver -match '^(\d+\.\d+\.\d+)') {
            "NUM_VERSION=$($Matches[1])" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
            "SEMVER=1" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
          } else {
            "NUM_VERSION=$ver" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
            "SEMVER=0" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
          }
          "VERSION=$ver" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY

      - name: Inject version (when tag is semver-like)
        shell: pwsh
        run: |
          if ($env:SEMVER -eq "1") {
            python Telegram/build/set_version.py "$env:NUM_VERSION"
          } else {
            Write-Host "tag 不是 x.y.z 形式，内部版本保持仓库默认"
          }

      - name: Configure
        shell: pwsh
        env:
          Platform: x64
        run: |
          Set-Location Telegram
          # 便攜版自行發布，關閉自動更新：避免從上游更新源拉包（唯一的 RCE 面）
          cmd /c "configure.bat x64 -D TDESKTOP_API_ID=$env:TDESKTOP_API_ID -D TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON" 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/configure.log"
          exit $LASTEXITCODE

      - name: Expand pagefile
        shell: pwsh
        run: |
          # WHY: the final link peaks past physical RAM and a memory-stormed
          # runner agent dies as "lost communication" instead of a build
          # error; a large explicit pagefile carries the VM through the peak.
          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false }
          }
          $pf = Get-CimInstance Win32_PageFileSetting | Select-Object -First 1
          if ($pf) {
            Set-CimInstance -InputObject $pf -Property @{ InitialSize = 8192; MaximumSize = 65536 }
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{
              Name = 'C:\pagefile.sys'
              InitialSize = 8192
              MaximumSize = 65536
            }
          }

      - name: Build Telegram (Release, parallel, full log)
        shell: pwsh
        env:
          Platform: x64
        run: |
          $log = "$env:GITHUB_WORKSPACE/build.log"
          function Invoke-Build([string]$m) {
            # WHY: Tee-Object streams every msbuild line through .NET pipeline
            # objects and the pwsh process itself died of OOM on error floods;
            # cmd redirection writes straight to disk with no buffering.
            Write-Host "build pass /m:$m start $(Get-Date -Format o)"
            cmd /c "cmake --build out --config Release --target Telegram -- /m:$m /v:m /p:MultiProcessorCompilation=false > ""$log"" 2>&1"
            Write-Host "build pass /m:$m end $(Get-Date -Format o) exit=$LASTEXITCODE"
            return $LASTEXITCODE
          }
          function Show-Tail {
            if (Test-Path $log) {
              Get-Content $log -Tail 400
            }
          }
          # WHY: the /m:2 bulk pass caches most objs fast, and the /m:1
          # retries are incremental, rebuilding only the heap-starved TUs
          # and re-running the linker with a lower per-cl peak, so passes converge.
          $code = Invoke-Build 2
          for ($i = 1; $i -le 5 -and $code -ne 0 -and
              (Select-String -Path $log -Pattern 'C1060','C1076','C3859','LNK1102','LNK1104','MSB6006','MSB4018' -SimpleMatch -Quiet); $i++) {
            $env:CL = '/cgthreads1'
            Write-Host "compiler/linker OOM detected - incremental retry $i/5 with /m:1"
            $code = Invoke-Build 1
          }
          Show-Tail
          exit $code

      - name: Extract compile errors
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern "error [A-Z]+[0-9]+:" |
              ForEach-Object { $_.Line.Trim() } |
              Set-Content -Path errors.txt -Encoding UTF8
            $total = (Get-Content errors.txt -ErrorAction SilentlyContinue | Measure-Object).Count
            "### 编译错误" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            "总计: $total" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            Get-Content errors.txt -ErrorAction SilentlyContinue |
              ForEach-Object { if ($_ -match 'error ([A-Z]+[0-9]+):') { $Matches[1] } } |
              Group-Object |
              Sort-Object Count -Descending |
              ForEach-Object { "- $($_.Name) x$($_.Count)" } |
              Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
            Get-Content errors.txt -TotalCount 60 -ErrorAction SilentlyContinue |
              ForEach-Object { "- ``$_``" } |
              Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
          } else {
            "build.log 未生成（configure/build 前失败）" | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Package portable exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem out/Release -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'AyuGram|Telegram' } |
            Select-Object -First 1
          if (-not $exe) {
            throw "out/Release 下没有找到 exe"
          }
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item $exe.FullName package/ -Force
          foreach ($f in @("LICENSE", "LEGAL")) {
            if (Test-Path $f) { Copy-Item $f package/ -Force }
          }
          $asset = "AyuGram_$($env:VERSION)_win64_portable.zip"
          Compress-Archive -Path "package/*" -DestinationPath "dist/$asset" -Force
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content dist/sha256sums.txt -Encoding ASCII
          "ASSET_ZIP=dist/$asset" | Out-File -Append -Encoding UTF8 $env:GITHUB_ENV
          Get-Content dist/sha256sums.txt | Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
          Get-Item "dist/$asset" | Select-Object Name, Length | Format-List |
            Out-File -Append -Encoding UTF8 $env:GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            configure.log
            prepare.log
            errors.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare release notes
        shell: pwsh
        run: |
          $notes = "docs/release-notes/$($env:VERSION_TAG).md"
          if (Test-Path $notes) {
            Copy-Item $notes release-body.md
          } else {
            Set-Content release-body.md "（本版本没有发布说明文件）" -Encoding UTF8
          }
          # WHY: publishing fires a release event that re-triggers this
          # workflow; the marker lets the jobs' guard skip that second run.
          Add-Content release-body.md "<!-- auto-built -->" -Encoding UTF8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AyuGram Desktop ${{ env.VERSION }} (win64)"
          draft: false
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
          body_path: release-body.md
          files: |
            dist/*.zip
            dist/sha256sums.txt
